version: "3.8"
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports: ["6333:6333"]
    volumes:
      - qdrant_storage:/qdrant/storage

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    # replace with your model & GPU flags
    command: ["--model", "/models/llama3-instruct", "--port", "8000"]
    ports: ["8000:8000"]
    volumes:
      - ./models:/models
    deploy:
    resources:
    reservations:
    devices:
      - capabilities: [gpu]


  gateway:
    build: ./services/gateway
    container_name: gateway
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [qdrant, vllm]


  telegram_bot:
    build: ./services/telegram-bot
    container_name: tg-bot
    env_file: .env
    depends_on: [gateway]

volumes:
  qdrant_storage: